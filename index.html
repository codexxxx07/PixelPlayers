<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pixel Players — an AI-powered cognitive gaming and memory assistance platform for elderly users. Helping memories stay meaningful."
    />
    <meta name="theme-color" content="#fffaf3" />
    <script>
      // Pixel Players theme boot — runs before first paint so there is no flash
      // of the wrong theme. Reads localStorage, falls back to OS preference.
      (function () {
        try {
          var t = localStorage.getItem('pixelplayers-theme');
          if (t !== 'light' && t !== 'dark') {
            t =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          var root = document.documentElement;
          root.classList.toggle('dark', t === 'dark');
          root.setAttribute('data-theme', t);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', t === 'dark' ? '#161d1b' : '#fffaf3');
          }
        } catch (e) {
          /* storage unavailable — keep light */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Pixel Players — Helping Memories Stay Meaningful</title>
    <style>
      .boot-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background-color: #fffaf3;
        font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      }

      .boot-bar {
        position: sticky;
        top: 0;
        z-index: 50;
        width: 100%;
        background-color: #fff8f0;
        box-shadow: 0 8px 22px -14px rgba(63, 40, 25, 0.25);
      }

      .boot-bar-inner {
        max-width: 80rem;
        margin: 0 auto;
        padding: 0 1rem;
        height: 5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .boot-logo-block {
        height: 2.5rem;
        width: 2.5rem;
        border-radius: 0.75rem;
      }

      .boot-logo-text {
        height: 1rem;
        width: 9rem;
        border-radius: 0.25rem;
      }

      .boot-nav-links {
        display: none;
        align-items: center;
        gap: 2.25rem;
      }

      .boot-nav-link {
        height: 0.75rem;
        width: 4rem;
        border-radius: 0.25rem;
      }

      .boot-cta {
        height: 2.75rem;
        width: 7.5rem;
        border-radius: 0.75rem;
      }

      .boot-lamp {
        height: 2.25rem;
        width: 2.25rem;
        border-radius: 9999px;
      }

      .boot-hero {
        flex: 1;
        max-width: 80rem;
        width: 100%;
        margin: 0 auto;
        padding: 4rem 1.5rem;
        text-align: center;
      }

      .boot-hero-badge {
        height: 2rem;
        width: 10rem;
        margin: 0 auto;
        border-radius: 9999px;
      }

      .boot-hero-title {
        height: 1.5rem;
        width: 75%;
        max-width: 34rem;
        margin: 2rem auto 0;
        border-radius: 0.375rem;
      }

      .boot-hero-sub {
        height: 1rem;
        width: 60%;
        max-width: 26rem;
        margin: 1rem auto 0;
        border-radius: 0.375rem;
      }

      .boot-hero-buttons {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 2rem;
        flex-wrap: wrap;
      }

      .boot-hero-btn {
        height: 3.25rem;
        width: 13rem;
        border-radius: 0.9rem;
      }

      .boot-card-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.25rem;
        max-width: 80rem;
        margin: 2rem auto 0;
        padding: 0 1.5rem;
      }

      .boot-card {
        height: 13rem;
        border-radius: 1.25rem;
      }

      .boot-footer {
        background-color: #134e4a;
        padding: 2.5rem 1.5rem;
        margin-top: 3rem;
      }

      .boot-footer-inner {
        max-width: 80rem;
        margin: 0 auto;
      }

      .boot-footer-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
      }

      .boot-footer-block {
        height: 6.5rem;
        border-radius: 0.75rem;
      }

      .sk-boot {
        background: linear-gradient(180deg, #fdf3e3, #f6dfc1);
        border: 1px solid #efcda3;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
        position: relative;
        overflow: hidden;
      }

      .sk-boot::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, 0.45) 50%, transparent 80%);
        animation: boot-sweep 1.6s ease-in-out infinite;
      }

      @keyframes boot-sweep {
        0% {
          transform: translateX(-100%);
        }
        55%,
        100% {
          transform: translateX(100%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sk-boot::after {
          animation: none;
        }
      }

      /* Dark theme boot shell — mirrors the app's remapped palette */
      .dark .boot-shell {
        background-color: #16181a;
      }

      .dark .boot-bar {
        background-color: #191d1f;
      }

      .dark .sk-boot {
        background: linear-gradient(180deg, #232932, #1b2026);
        border-color: #2c333a;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .dark .sk-boot::after {
        background: linear-gradient(
          100deg,
          transparent 20%,
          rgba(255, 255, 255, 0.07) 50%,
          transparent 80%
        );
      }

      .dark .boot-footer {
        background-color: #0a3530;
      }

      @media (min-width: 64rem) {
        .boot-nav-links {
          display: flex;
        }
      }

      @media (max-width: 40rem) {
        .boot-logo-text,
        .boot-cta {
          display: none;
        }
        .boot-hero {
          padding-top: 3rem;
        }
        .boot-card-row {
          grid-template-columns: 1fr;
        }
        .boot-footer-row {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-busy="true" aria-hidden="true">
        <div class="boot-bar">
          <div class="boot-bar-inner">
            <div style="display:flex;align-items:center;gap:0.625rem">
              <div class="boot-logo-block sk-boot" style="position:relative">
                <div style="position:absolute;top:4px;right:4px;width:4px;height:4px;border-radius:1px;background:#14b8a6"></div>
                <div style="position:absolute;top:4px;right:10px;width:3px;height:3px;border-radius:1px;background:#fbbf24"></div>
              </div>
              <div class="boot-logo-text sk-boot"></div>
            </div>
            <div class="boot-nav-links">
              <div class="boot-nav-link sk-boot"></div>
              <div class="boot-nav-link sk-boot"></div>
              <div class="boot-nav-link sk-boot"></div>
              <div class="boot-nav-link sk-boot"></div>
            </div>
            <div style="display:flex;gap:0.75rem;align-items:center">
              <div class="boot-lamp sk-boot"></div>
              <div class="boot-cta sk-boot"></div>
              <div class="boot-cta sk-boot"></div>
            </div>
          </div>
        </div>
        <div style="flex: 1">
          <div class="boot-hero">
            <div class="boot-hero-badge sk-boot"></div>
            <div class="boot-hero-title sk-boot"></div>
            <div class="boot-hero-sub sk-boot"></div>
            <div class="boot-hero-buttons">
              <div class="boot-hero-btn sk-boot"></div>
              <div class="boot-hero-btn sk-boot"></div>
            </div>
          </div>
          <div class="boot-card-row">
            <div class="boot-card sk-boot"></div>
            <div class="boot-card sk-boot"></div>
            <div class="boot-card sk-boot"></div>
          </div>
        </div>
        <div class="boot-footer-bar" style="display:flex;width:100%;height:0.75rem">
          <div style="flex:1;background:rgba(45,212,191,0.5)"></div>
          <div style="flex:1;background:rgba(251,191,36,0.4)"></div>
          <div style="flex:1;background:rgba(20,184,166,0.5)"></div>
          <div style="flex:1;background:rgba(13,148,136,0.5)"></div>
          <div style="flex:1;background:rgba(245,158,11,0.4)"></div>
          <div style="flex:1;background:rgba(45,212,191,0.5)"></div>
          <div style="flex:1;background:rgba(15,118,110,0.5)"></div>
          <div style="flex:1;background:rgba(251,191,36,0.4)"></div>
          <div style="flex:1;background:rgba(20,184,166,0.5)"></div>
          <div style="flex:1;background:rgba(13,148,136,0.5)"></div>
          <div style="flex:1;background:rgba(245,158,11,0.4)"></div>
          <div style="flex:1;background:rgba(45,212,191,0.5)"></div>
          <div style="flex:1;background:rgba(15,118,110,0.5)"></div>
          <div style="flex:1;background:rgba(251,191,36,0.4)"></div>
          <div style="flex:1;background:rgba(20,184,166,0.5)"></div>
          <div style="flex:1;background:rgba(13,148,136,0.5)"></div>
        </div>
        <div class="boot-footer">
          <div class="boot-footer-inner">
            <div class="boot-footer-row">
              <div class="boot-footer-block sk-boot"></div>
              <div class="boot-footer-block sk-boot"></div>
              <div class="boot-footer-block sk-boot"></div>
              <div class="boot-footer-block sk-boot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
